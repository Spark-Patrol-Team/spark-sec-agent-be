services:
  mysql:
    image: mysql:8.4
    container_name: spark-sec-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sec_agent
      MYSQL_USER: sec_agent
      MYSQL_PASSWORD: sec_agent
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usec_agent", "-psec_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:

