services:
  api:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: spark-sec-agent-api
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
