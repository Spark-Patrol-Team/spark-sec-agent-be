name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          uv run --locked pytest -q

      - name: Generate OpenAPI document
        env:
          PYTHONPATH: src
        run: |
          uv run --locked python -m sec_agent.scripts.generate_openapi

      - name: Check OpenAPI document is up to date
        run: |
          git diff --exit-code -- docs/swagger/openapi.json
