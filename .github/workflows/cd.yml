name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy:
        description: "是否通过 SSH 部署到服务器"
        required: true
        type: boolean
        default: false
      image_tag:
        description: "手动构建/部署使用的镜像 tag；为空则使用当前提交短 SHA"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Before Delivery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          uv run --locked pytest -q

      - name: Generate OpenAPI document
        env:
          PYTHONPATH: src
        run: |
          uv run --locked python -m sec_agent.scripts.generate_openapi

      - name: Check OpenAPI document is up to date
        run: |
          git diff --exit-code -- docs/swagger/openapi.json

  image:
    name: Build And Push Image
    runs-on: ubuntu-latest
    needs:
      - test
    outputs:
      image-ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          manual_tag="${{ github.event.inputs.image_tag }}"
          if [[ -n "$manual_tag" ]]; then
            deploy_tag="$manual_tag"
          else
            deploy_tag="sha-${GITHUB_SHA::7}"
          fi
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=$deploy_tag" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_name:$deploy_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.deploy_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy By SSH
    runs-on: ubuntu-latest
    needs:
      - image
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    env:
      IMAGE_REF: ${{ needs.image.outputs.image-ref }}
      CD_SSH_HOST: ${{ secrets.CD_SSH_HOST }}
      CD_SSH_USER: ${{ secrets.CD_SSH_USER }}
      CD_SSH_PORT: ${{ secrets.CD_SSH_PORT }}
      CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
      CD_DEPLOY_PATH: ${{ secrets.CD_DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        run: |
          missing=0
          for name in CD_SSH_HOST CD_SSH_USER CD_SSH_KEY CD_DEPLOY_PATH GHCR_USERNAME GHCR_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        shell: bash
        run: |
          port="${CD_SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CD_SSH_KEY" > ~/.ssh/cd_key
          chmod 600 ~/.ssh/cd_key
          ssh-keyscan -p "$port" "$CD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose file
        shell: bash
        run: |
          port="${CD_SSH_PORT:-22}"
          ssh -i ~/.ssh/cd_key -p "$port" "$CD_SSH_USER@$CD_SSH_HOST" "mkdir -p '$CD_DEPLOY_PATH/deploy'"
          scp -i ~/.ssh/cd_key -P "$port" deploy/docker-compose.prod.yml "$CD_SSH_USER@$CD_SSH_HOST:$CD_DEPLOY_PATH/deploy/docker-compose.prod.yml"

      - name: Pull image and restart service
        shell: bash
        run: |
          port="${CD_SSH_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/cd_key -p "$port" "$CD_SSH_USER@$CD_SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh -i ~/.ssh/cd_key -p "$port" "$CD_SSH_USER@$CD_SSH_HOST" \
            "cd '$CD_DEPLOY_PATH' && test -f .env && APP_IMAGE='$IMAGE_REF' docker compose -p spark-sec-agent-be --env-file .env -f deploy/docker-compose.prod.yml pull api mysql && APP_IMAGE='$IMAGE_REF' docker compose -p spark-sec-agent-be --env-file .env -f deploy/docker-compose.prod.yml up -d api && APP_IMAGE='$IMAGE_REF' docker compose -p spark-sec-agent-be --env-file .env -f deploy/docker-compose.prod.yml ps api && docker image prune -f"
