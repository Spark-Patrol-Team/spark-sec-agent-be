[project]
name = "spark-sec-agent-be"
version = "0.1.0"
description = "MVP scaffold for security event orchestration and state transitions."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.13.3",
    "pymysql>=1.1.0,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "tzdata>=2024.1,<2027.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
sec-agent-generate-openapi = "sec_agent.scripts.generate_openapi:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
